# 这是 MVP 动态 SQL 编译器使用的物理映射版本。
version: mom-test@0.3.0
# 编译器和数据库执行器只能访问这个逻辑库。
database: mom-test

# entities 把本体实体及属性映射到数据库结构；这里不保存完整 SQL 模板。
entities:
  ProductionPlan:
    source_kind: table
    table: produce_plan
    alias: p
    primary_key: id
    active_filter: {column: deleted, operator: EQ, value: 0}
    properties:
      sourceId: id
      planNo: code
      name: name
      plannedQty: plan_produce_num
      statusCode: plan_status_id
      planStartTime: plan_start_time
      planEndTime: plan_end_time
      outputProductId: product_id

  ProcessTask:
    source_kind: table
    table: produce_order_make_process_task
    alias: t
    primary_key: id
    active_filter: {column: deleted, operator: EQ, value: 0}
    properties:
      sourceId: id
      taskNo: make_process_task_code
      planId: produce_plan_id
      outputProductId: product_id
      plannedQty: plan_produce_num
      statusCode: status_id
      startTime: start_time
      finishTime: finish_time

  PlanBOMItem:
    source_kind: table
    table: produce_plan_bom_detail
    alias: bom
    primary_key: id
    active_filter: {column: deleted, operator: EQ, value: 0}
    properties:
      sourceId: id
      planId: plan_id
      parentId: parent_id
      productId: product_id
      standardUsage: use_num
      wastageRate: wastage_rate
      layer: layer

  MaterialIssue:
    source_kind: header_detail
    alias: issue
    header_table: produce_pick
    header_alias: pick
    detail_table: produce_pick_relation_product
    detail_alias: issue_line
    detail_join: {left: pick.id, right: issue_line.pick_id}
    active_filters:
      - {alias: pick, column: deleted, operator: EQ, value: 0}
      - {alias: issue_line, column: deleted, operator: EQ, value: 0}
    properties:
      taskId: pick.make_process_task_id
      materialId: issue_line.product_id
      quantity: issue_line.num

  MaterialReturn:
    source_kind: header_detail
    alias: material_return
    header_table: produce_return
    header_alias: ret
    detail_table: produce_return_relation_product
    detail_alias: return_line
    detail_join: {left: ret.id, right: return_line.return_id}
    active_filters:
      - {alias: ret, column: deleted, operator: EQ, value: 0}
      - {alias: return_line, column: deleted, operator: EQ, value: 0}
    properties:
      taskId: ret.make_process_task_id
      materialId: return_line.product_id
      quantity: return_line.num

  ProductionReport:
    source_kind: table
    table: produce_report
    alias: report
    primary_key: id
    active_filter: {column: deleted, operator: EQ, value: 0}
    properties:
      sourceId: id
      taskId: process_task_id
      selfQualifiedQty: produce_num
      selfNonconformingQty: self_check_ng_num

  Product:
    source_kind: table
    table: design_product
    alias: product
    primary_key: id
    active_filter: {column: deleted, operator: EQ, value: 0}
    properties:
      sourceId: id
      code: code
      name: name
      specification: spec

# relations 是本体 Traverse 算子的物理实现，不限定整条查询路线。
relations:
  HAS_PROCESS_TASK:
    from: ProductionPlan
    to: ProcessTask
    joins:
      - {left: ProductionPlan.sourceId, right: ProcessTask.planId}

  HAS_PLAN_BOM_ITEM:
    from: ProductionPlan
    to: PlanBOMItem
    joins:
      - {left: ProductionPlan.sourceId, right: PlanBOMItem.planId}

  BOM_ITEM_MATERIAL:
    from: PlanBOMItem
    to: Product
    joins:
      - {left: PlanBOMItem.productId, right: Product.sourceId}

  HAS_MATERIAL_ISSUE:
    from: ProcessTask
    to: MaterialIssue
    joins:
      - {left: ProcessTask.sourceId, right: MaterialIssue.taskId}

  HAS_MATERIAL_RETURN:
    from: ProcessTask
    to: MaterialReturn
    joins:
      - {left: ProcessTask.sourceId, right: MaterialReturn.taskId}

  HAS_PRODUCTION_REPORT:
    from: ProcessTask
    to: ProductionReport
    joins:
      - {left: ProcessTask.sourceId, right: ProductionReport.taskId}

# metrics 登记指标来源、粒度和依赖；模型只能引用指标 ID。
metrics:
  productionPlanCount:
    kind: aggregate_count
    source_entity: ProductionPlan
    source_property: sourceId
    aggregation: COUNT
    grain: []

  grossIssuedQty:
    kind: aggregate
    source_entity: MaterialIssue
    source_property: quantity
    aggregation: SUM
    grain: [ProcessTask, Product]

  returnedQty:
    kind: aggregate
    source_entity: MaterialReturn
    source_property: quantity
    aggregation: SUM
    grain: [ProcessTask, Product]

  actualReportedQty:
    kind: aggregate_expression
    source_entity: ProductionReport
    source_properties: [selfQualifiedQty, selfNonconformingQty]
    row_operator: ADD
    aggregation: SUM
    grain: [ProcessTask]

  ratedOutputQty:
    kind: derived
    dependencies: [grossIssuedQty, PlanBOMItem.standardUsage]
    operator: DIVIDE
    zero_division: NULL
    grain: [ProcessTask, Product]

  signedDifferenceQty:
    kind: derived
    dependencies: [ratedOutputQty, actualReportedQty]
    operator: SUBTRACT
    grain: [ProcessTask, Product]

  signedDifferenceRate:
    kind: derived
    dependencies: [signedDifferenceQty, ratedOutputQty]
    operator: DIVIDE
    zero_division: NULL
    grain: [ProcessTask, Product]

  severityRate:
    kind: derived
    dependencies: [signedDifferenceRate]
    operator: ABS
    grain: [ProcessTask, Product]

# output_fields 是 Project 和 Sort 可引用的本体字段白名单。
output_fields:
  ProductionPlan.sourceId: plan_id
  ProductionPlan.planNo: plan_code
  ProductionPlan.name: plan_name
  ProductionPlan.plannedQty: planned_quantity
  ProductionPlan.statusCode: plan_status_code
  ProductionPlan.planStartTime: plan_start_time
  ProductionPlan.planEndTime: plan_end_time
  ProcessTask.sourceId: task_id
  ProcessTask.taskNo: task_code
  ProcessTask.plannedQty: task_planned_quantity
  ProcessTask.statusCode: task_status_code
  ProcessTask.startTime: task_start_time
  ProcessTask.finishTime: task_finish_time
  PlanBOMItem.sourceId: bom_item_id
  PlanBOMItem.standardUsage: standard_usage
  PlanBOMItem.wastageRate: wastage_rate
  PlanBOMItem.layer: bom_layer
  Product.sourceId: material_id
  Product.code: material_code
  Product.name: material_name
  Product.specification: material_specification
